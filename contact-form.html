<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
      color: #1e1b4b;
    }
    .card {
      width: min(100%, 560px);
      padding: 2rem;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 40px rgba(67, 56, 202, .16);
    }
    h1 { margin: 0 0 .5rem; font-size: 1.8rem; }
    .intro { margin: 0 0 1.5rem; color: #57537a; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .field { display: grid; gap: .45rem; margin-bottom: 1rem; }
    label { font-weight: 700; font-size: .93rem; }
    input, select, textarea {
      width: 100%;
      padding: .78rem .85rem;
      border: 1px solid #c7c5df;
      border-radius: 9px;
      font: inherit;
      color: inherit;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px #e0e7ff;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: .9rem 1rem;
      background: #4f46e5;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #success { display: none; margin: 1rem 0 0; color: #166534; font-weight: 700; }
    @media (max-width: 480px) { .card { padding: 1.4rem; } .grid { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Get in touch</h1>
    <p class="intro">Send us a message and weâ€™ll get back to you soon.</p>

    <form id="contact-form">
      <div class="grid">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" name="firstName" type="text" autocomplete="given-name" required />
        </div>
        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" name="lastName" type="text" autocomplete="family-name" required />
        </div>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="topic">What can we help with?</label>
        <select id="topic" name="topic" required>
          <option value="" selected disabled>Select a topic</option>
          <option>General enquiry</option>
          <option>Support</option>
          <option>Feedback</option>
        </select>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
      </div>
      <button type="submit">Send message</button>
      <p id="success" role="status">Thanks! Your message has been sent.</p>
    </form>
  </main>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function (event) {
      event.preventDefault();
      if (!this.checkValidity()) return;
      document.getElementById('success').style.display = 'block';
      this.reset();
    });
  </script>
</body>
</html>
